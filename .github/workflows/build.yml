name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: List Files
      run: ls -la

    - name: Unzip Project
      run: |
        unzip -q lib.zip -d extracted_files
        ls -la extracted_files

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    - name: Get Dependencies
      run: flutter pub get
      working-directory: ./extracted_files

    - name: Build APK
      run: flutter build apk --release
      working-directory: ./extracted_files

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: ./extracted_files/build/app/outputs/flutter-apk/app-release.apk
